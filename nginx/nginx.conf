# Reverse proxy: routes "/api/*" to FastAPI, everything else to Next.js.
# Runs inside the Docker network, so upstream names resolve via Compose DNS.
# TLS uses a self-signed localhost cert auto-generated by
# /docker-entrypoint.d/10-generate-cert.sh on container start (see nginx/Dockerfile).

client_max_body_size 20m;   # allow tray-scan photo uploads through the proxy

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

# Plain HTTP just redirects to HTTPS.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # 백엔드 API (proxy_pass 끝에 / 붙이면 /api 가 잘리므로 붙이지 말 것)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;            # AI 추론 대기 여유
    }

    # 프론트엔드
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;             # Next.js dev HMR (WebSocket)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# !!!   2가지 주의 사항     !!!
# 1. proxy_pass http://backend:8000; — 끝에 /를 붙이면 /api가 잘려서 백엔드로 전달됩니다. 우리 API 스펙이 /api/auth/login 형태이므로 / 없이 씁니다.
# 2. backend, frontend는 docker-compose의 서비스 이름입니다. 이름을 바꾸면 여기도 같이 바꿔야 합니다.