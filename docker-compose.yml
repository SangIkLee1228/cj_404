services:
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* 는 빌드 시점에 코드에 박히므로 build args 로도 넘겨야 함
        - NEXT_PUBLIC_API_URL=/api
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=/api
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-https://localhost}
    ports:
      - "8000:8000" # direct access for /docs (Swagger UI); remove in production
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs # self-signed cert, generated on first start, persists per machine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
