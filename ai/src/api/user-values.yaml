# 모델 빌드 버전에 대한 설명을 입력
modelDesc: pipeline test final

# 빌드 버전과 함께 연동해서 저장할 학습 버전 ID를 입력
aim_id: 123

# 개발환경에서 복제할 폴더의 목록을 지정 (없으면 스킵됨)
copy_folder_list:
  - /home/jovyan/jovyan/src/core/models
  - /home/jovyan/src/core/models
  - /home/jovyan/src/core/model
  - /home/jovyan/src/core/checkpoint

# -------------------------------------------------
# 아래는 추론 코드를 맵핑하는 영역으로, 가급적 수정하지 않습니다
# -------------------------------------------------
model:
  # 진입 파일이 위치한 폴더를 절대 경로로 입력
  initialFilePath: "/root/src/core"

  # 진입 파일명을 입력
  initialFileName: "predict_module.py"

  # 위 파일명에서 초기화 함수의 함수명을 입력
  initialFuncName: "init"

  # 위 파일명에서 추론/비즈니스 로직 처리 함수명을 입력
  excuteFuncName: "predict"