name: PR Target Guard

# master 로 향하는 PR 의 출처만 강제한다.
#   feature/fix/docs/refactor/chore  ->  dev-fe / dev-be  ->  test  ->  master
#
# test 는 통합 검증 브랜치라 여러 출처(dev-fe, dev-be, chore/*, fix/* 등)에서
# PR 이 들어온다. 여기에 가드를 걸면 기존 작업 흐름이 막히므로 걸지 않는다.
# (frontend/.claude/rules/git-flow.md 참고)

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: master PR 출처 확인 (test / hotfix 만 허용)
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          set -eu

          case "$HEAD" in
            test|hotfix/*)
              echo "OK: $HEAD -> master"
              ;;
            *)
              echo "::error::master 로의 PR 은 test 브랜치(또는 hotfix/*)에서만 허용됩니다. 현재 head 브랜치: '$HEAD'. dev-fe / dev-be / 작업 브랜치는 먼저 test 로 PR 을 올려주세요."
              exit 1
              ;;
          esac
